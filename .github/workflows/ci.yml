name: CI / Deploy

on:
  push:
    branches: [main]
    tags: ["v*", "demo-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # gitleaks cần lịch sử đầy đủ để quét dải commit
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm audit --audit-level=high --omit=dev
      - name: Quét secret (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  deploy-staging:
    # Chỉ chạy khi đã tạo tài nguyên staging (D1/R2/Queues) và đặt biến repo STAGING_ENABLED=true
    if: github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      # Vite plugin chọn môi trường lúc BUILD (CLOUDFLARE_ENV); `wrangler deploy --env` bị bỏ qua với bản build
      # Migrations chạy TRƯỚC build (khi chưa có config chuyển hướng của vite plugin)
      - run: npx wrangler d1 migrations apply huu-manh-erp-staging --env staging --remote
        env: &cf
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: CLOUDFLARE_ENV=staging npm run build
      - run: npx wrangler deploy
        env: *cf
      # Website khách (Worker riêng) — env staging dùng D1/R2/Queue staging
      - run: npm run build:shop
      - run: npx wrangler deploy -c wrangler.shop.jsonc --env staging
        env: *cf

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: production # bật "Required reviewers" trong GitHub Environments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npx wrangler d1 migrations apply huu-manh-erp --remote
        env: &cfp
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
      - run: npx wrangler deploy
        env: *cfp
      - run: npm run build:shop
      - run: npx wrangler deploy -c wrangler.shop.jsonc
        env: *cfp
      - name: Smoke test
        run: curl -fsS "${{ vars.PROD_URL }}/api/health"

  # Bản demo trên *.workers.dev — chạy khi đẩy tag demo-* (vd demo-2026-11-24)
  deploy-demo:
    if: startsWith(github.ref, 'refs/tags/demo-')
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - name: Migrations (bỏ qua nếu đã áp)
        run: npx wrangler d1 migrations apply huu-manh-erp --remote
      - name: Font tiếng Việt cho PDF lên R2
        run: |
          npx wrangler r2 object put huu-manh-erp-files/fonts/BeVietnamPro-Regular.ttf --remote --content-type font/ttf --file node_modules/@expo-google-fonts/be-vietnam-pro/400Regular/BeVietnamPro_400Regular.ttf
          npx wrangler r2 object put huu-manh-erp-files/fonts/BeVietnamPro-Bold.ttf --remote --content-type font/ttf --file node_modules/@expo-google-fonts/be-vietnam-pro/700Bold/BeVietnamPro_700Bold.ttf
      - name: Deploy ERP (demo)
        run: |
          CLOUDFLARE_ENV=demo npm run build
          npx wrangler deploy
      - name: Deploy website (demo)
        run: |
          CLOUDFLARE_ENV=demo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA npm run build:shop
          npx wrangler deploy -c dist-shop/huu_manh_shop/wrangler.json

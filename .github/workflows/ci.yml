name: CI / Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm audit --audit-level=high --omit=dev
      - name: Quét secret (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx wrangler d1 migrations apply huu-manh-erp-staging --env staging --remote
        env: &cf
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --env staging
        env: *cf
      # Website khách (Worker riêng) — staging dùng cùng cấu hình, đổi tên qua --name
      - run: npm run build:shop
      - run: npx wrangler deploy -c wrangler.shop.jsonc --name huu-manh-shop-staging
        env: *cf

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: production # bật "Required reviewers" trong GitHub Environments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx wrangler d1 migrations apply huu-manh-erp --remote
        env: &cfp
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env: *cfp
      - run: npm run build:shop
      - run: npx wrangler deploy -c wrangler.shop.jsonc
        env: *cfp
      - name: Smoke test
        run: curl -fsS "${{ vars.PROD_URL }}/api/health"
